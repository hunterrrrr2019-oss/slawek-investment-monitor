name: Slawek Investment Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Uruchom agenta
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start
        run: python monitor.py
